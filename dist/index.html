<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 28px;
      background: radial-gradient(1200px 800px at 30% 20%, #16233f 0%, #101623 55%, #0b0e15 100%);
      color: #dbe2f0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 4px solid rgba(120, 150, 220, 0.18);
      border-top-color: #6d8dff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
    #status { font-size: 13px; color: #8b98b4; }
    #status.error { color: #ff8080; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>DeepSeek Harness</h1>
  <div id="status">正在启动本地 dsh 宿主…</div>
</body>
</html>
